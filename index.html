<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon</title>
    <link rel="icon" href="./img/simon_icon-1.png">
    <!-- bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">

    <link rel="stylesheet" href="./css/style.css">
</head>

<body class="bg-dark text-light">

    <div class="container">

        <div class="row vh-100 align-items-center justify-content-center">

            <div class="col-6">

                <section class="text-center">

                    <!-- timer -->
                    <div class="fs-1 mb-3">Timer: <span id="timer">0</span></div>


                    <!-- numeri random -->
                    <ul class="d-flex justify-content-between d-none" id="numbers-random">
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                    </ul>

                    <!-- regole gioco -->
                    <p class="fs-5 game-rules">
                        Clicca il pulsante per Visualizzare 5 numeri casuali. <br>
                        Da lì parte un timer di 30 secondi. <br> <br>
                        Dopo 30 secondi i numeri scompaiono e appaiono invece 5 input in cui devi inserire i numeri che
                        hai visto precedentemente.
                    </p>


                    <!-- bottone genera numeri -->
                    <button id="btn-gen-numbers" class="btn btn-success">Genera numeri</button>



                    <!-- form input numeri da compilare -->
                    <form class="d-none" id="user-form">
                        <p>Inserisci tutti i numeri che ricordi (l'ordine non è importante)</p>

                        <div class="row row-cols-5 mb-3">

                            <div class="col">
                              <input required min="1" max="100" type="number" id="number1" class="form-control">
                            </div>

                            <div class="col">
                              <input required min="1" max="100" type="number" id="number2" class="form-control">
                            </div>

                            <div class="col">
                              <input required min="1" max="100" type="number" id="number3" class="form-control">
                            </div>

                            <div class="col">
                              <input required min="1" max="100" type="number" id="number4" class="form-control">
                            </div>

                            <div class="col">
                              <input required min="1" max="100" type="number" id="number5" class="form-control">
                            </div>

                        </div>

                        <!-- messaggio numeri individuati -->
                        <p class="mt-3 d-none" id="message-end-game"></p>
                        
                        <button type="submit" class="btn btn-primary" id="btn-form-user">Conferma</button>

                    </form>


                </section>
            </div>
        </div>
    </div>

    <script src="./js/script.js"></script>
</body>

</html>
